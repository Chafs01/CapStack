name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # golden-fixture engine tests gate every deploy
      - run: node tests/verify.mjs
      - run: node tests/verify-excel.mjs
      - run: node tests/verify-excel-ppu.mjs
      - run: node tests/verify-share.mjs
      - run: node tests/verify-figures.mjs
      - run: node tests/verify-draft.mjs
      - run: node tests/verify-health.mjs
      - run: node tests/verify-robustness.mjs
      - run: node tests/verify-excel-waterfall.mjs
      - run: node tests/verify-opex-capex.mjs
      - run: node tests/verify-dev-budget.mjs
      - run: node tests/verify-tax-basis.mjs
      - run: node tests/verify-rehab.mjs
      - run: node tests/verify-routes.mjs
      - run: node tests/verify-comps.mjs
      - run: node tests/verify-plan.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
