<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Square canvas because the only available renderer (qlmanage) forces a
       square and would otherwise distort. The card occupies the middle 630px
       band, y 285-915, which is what gets cropped out afterwards. -->
  <rect width="1200" height="1200" fill="#eae3d6"/>

  <!-- the card: warm bone ground, near-black ink, sharp corners, no gradients -->
  <rect x="48" y="333" width="1104" height="534" fill="#faf8f4" stroke="#d3cbba" stroke-width="1"/>
  <rect x="48" y="333" width="1104" height="3" fill="#181716"/>

  <!-- capital stack: senior debt widest at the base, equity smallest on top -->
  <rect x="209" y="528" width="104" height="34" fill="#b3261e"/>
  <rect x="186" y="577" width="150" height="34" fill="#3a3733"/>
  <rect x="163" y="626" width="196" height="34" fill="#8a8178"/>
  <rect x="140" y="675" width="242" height="34" fill="#c2b8a3"/>

  <text x="452" y="585" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#181716" letter-spacing="-2">SmartCapStack</text>

  <rect x="452" y="617" width="600" height="1" fill="#d3cbba"/>

  <text x="452" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="500" fill="#5c554c" letter-spacing="4.2">REAL ESTATE PRO FORMA</text>

  <text x="452" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#7a7267">Ten-year DCF, levered IRR, DSCR, sensitivity —</text>
  <text x="452" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#7a7267">exported as a live Excel model.</text>

  <text x="140" y="812" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="600" fill="#181716" letter-spacing="0.4">smartcapstack.com</text>
</svg>
